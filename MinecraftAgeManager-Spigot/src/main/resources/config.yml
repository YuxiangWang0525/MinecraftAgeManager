# ============================================
# MinecraftAgeManager 配置文件
# MCAP 未成年人防沉迷管理系统
# ============================================

# MCAP 后端服务地址 (必填)
MCAP: "http://localhost:3000"

# MCAP API Key (必填, 格式: mcap_xxxxxxxx)
APIKEY: "mcap_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# 未成年人限制策略 (必填)
# 可选值:
#   CNNPPA      - 国家新闻出版署政策: 仅周五/周六/周日及法定节假日 20:00-21:00 可游玩1小时
#   NoMinor     - 禁止所有未成年人登录
#   TimeLimited - 自定义时长限制 (配合下方 RemindTime / MaxTime 使用)
Policy: "CNNPPA"

# ======== TimeLimited 策略专用配置 ========
# 提醒时间 (分钟) - 当剩余时间少于该值时发送提醒
RemindTime: 60
# 强制下线时间 (分钟) - 每日最大可游玩时长
MaxTime: 90

# ======== 未成年人宵禁 (可选) ========
# 宵禁期间拒绝未成年人登录 (24小时制)
# 取消注释以启用:
# CurfewStart: 22
# CurfewEnd: 6

# ======== LuckyPerms 集成 (可选) ========
# 需要服务器安装 LuckyPerms 插件
LuckyPerms:
  # 是否启用 LuckyPerms 集成
  Enabled: true
  # 未成年玩家将被加入的权限组名称
  # 请确保该权限组已在 LuckyPerms 中创建
  MinorGroup: "Minor"

# ======== 可选配置 ========

# 自定义未成年玩家欢迎提示语 (取消注释以启用)
# MinorMotd: "&e[防沉迷] 您为未成年玩家, 请合理安排游戏时间!"

# 诚实奖励: 识别为未成年玩家后执行的补偿命令列表 (取消注释以启用)
# 可用占位符: {player} - 玩家名, {uuid} - 玩家UUID
# HonestyReward:
#   - "give {player} diamond 1"
#   - "say {player} 完成了实名认证, 获得奖励!"

# ======== CNNPPA 法定节假日列表 ========
# 格式: "MM-dd" (月-日), 每年可能需要手动更新
# CNNPPA 策略下, 以下日期视为法定节假日, 允许未成年人在 20:00-21:00 游玩
CNNPPAHolidays:
  - "01-01"  # 元旦
  - "01-02"
  - "01-03"
  - "02-01"  # 春节 (示例, 请按实际年份调整)
  - "02-02"
  - "02-03"
  - "02-04"
  - "02-05"
  - "02-06"
  - "02-07"
  - "04-04"  # 清明节
  - "04-05"
  - "04-06"
  - "05-01"  # 劳动节
  - "05-02"
  - "05-03"
  - "05-04"
  - "05-05"
  - "06-08"  # 端午节 (示例)
  - "06-09"
  - "06-10"
  - "09-15"  # 中秋节 (示例)
  - "09-16"
  - "09-17"
  - "10-01"  # 国庆节
  - "10-02"
  - "10-03"
  - "10-04"
  - "10-05"
  - "10-06"
  - "10-07"
