name: MinecraftAgeManager
description: MCAP 未成年人防沉迷管理系统 - 实名认证与游戏时长限制
version: '${version}'

main: com.yuxiangwang0525.minecraftAgeManager.MinecraftAgeManager
api-version: '1.18'

authors: [ RiverFrozer ]
website: yuxiangwang0525.com

commands:
  agemanager:
    description: 年龄管理主命令
    usage: /agemanager <timeleft|info|reload>
    permission: agemanager.use

permissions:
  agemanager.use:
    description: 允许使用年龄管理命令
    default: true
  agemanager.admin:
    description: 允许管理年龄管理插件(重载等)
    default: op
